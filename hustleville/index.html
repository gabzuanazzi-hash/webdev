<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hustleville</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game">

  <header class="hud">
    <img class="wordmark" src="assets/wordmark.svg" alt="Hustleville">
    <div class="nw" id="nw"></div>
  </header>

  <section class="profile">
    <div class="avatar" id="avatar">👶</div>
    <div class="who"><strong id="pname"></strong><span id="psub"></span></div>
    <div class="cash"><b id="cash">$0</b><small>cash</small></div>
  </section>

  <div class="stage">
    <section class="feed" id="feed" aria-live="polite"></section>
    <section class="sheet" id="sheet">
      <div class="sheet-head"><b id="sheetTitle"></b><button class="x" id="sheetClose" aria-label="Close">✕</button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <section class="stats" id="stats"></section>

  <nav class="tabs">
    <button data-p="money"><span>💰</span>Money</button>
    <button data-p="love"><span>❤️</span>Love</button>
    <button class="age" id="ageBtn" aria-label="Age one year"><span>＋</span>AGE</button>
    <button data-p="crazy"><span>😈</span>Crazy</button>
    <button data-p="status"><span>👑</span>Status</button>
  </nav>
</div>

<!-- generic modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="m-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="m-btns" id="modalBtns"></div>
  </div>
</div>

<!-- immersive contract desk -->
<div class="overlay contract" id="contract"><div class="desk" id="cDesk"></div></div>

<!-- title screen -->
<div class="overlay open title" id="title">
  <img src="assets/logo.svg" alt="Hustleville — Business · Life · Click">
  <p>👶 Be born · 🧑 Grow up · 💰 Build empires · ❤️ Love · 😈 Cause trouble · 👑 Rule · ⚰️ Die</p>
  <button class="btn gold big" id="btnNew">👶 Be born</button>
  <button class="btn big" id="btnCont" hidden>▶ Continue life</button>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
