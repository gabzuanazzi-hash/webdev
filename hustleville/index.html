<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hustleville</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game">

  <header class="hud">
    <button class="icon-btn" aria-label="Settings">⚙️</button>
    <img class="wordmark" src="assets/wordmark.svg" alt="Hustleville">
    <div class="chip gem">💎 <b id="gems">25</b></div>
  </header>

  <section class="profile">
    <div class="avatar" aria-hidden="true">🧑‍💼</div>
    <div class="who">
      <strong>Alex Rivera</strong>
      <span>Age 19 · Coffee Cart Owner</span>
      <div class="xp"><i style="width:42%"></i></div>
    </div>
    <div class="cash">
      <b id="cash">$12,480</b>
      <small id="rate">+$1 / tap · $3 / s</small>
    </div>
  </section>

  <main class="town">
    <aside class="meters" aria-label="Life meters">
      <div class="meter" style="--v:62;--c:var(--teal)"><span>💼</span><em>Career</em></div>
      <div class="meter" style="--v:35;--c:var(--gold)"><span>🪙</span><em>Wealth</em></div>
      <div class="meter" style="--v:80;--c:var(--green)"><span>💚</span><em>Health</em></div>
      <div class="meter" style="--v:55;--c:var(--coral)"><span>❤️</span><em>Love</em></div>
    </aside>

    <div class="diorama" aria-hidden="true">
      <div class="tower"></div><div class="shop"></div><div class="home"></div><div class="tree"></div>
    </div>
    <button class="coin" id="coin" aria-label="Hustle: tap to earn">$</button>
  </main>

  <section class="feed" id="feed" aria-live="polite">
    <article class="event"><span>🤝</span><p>Closed a deal at the cafe <b class="plus">+$250</b></p></article>
    <article class="event"><span>🏃</span><p>Went for a morning jog <b class="plus">+Health</b></p></article>
    <article class="event"><span>🎓</span><p>Finished an online course <b class="plus">+Career</b></p></article>
  </section>

  <nav class="tabs">
    <button class="on"><span>💼</span>Business</button>
    <button><span>🏡</span>Life</button>
    <button class="go" id="go" aria-label="Hustle"><span>⚡</span>HUSTLE</button>
    <button><span>🚀</span>Upgrades</button>
    <button><span>🛍️</span>Shop</button>
  </nav>
</div>
<script src="game.js"></script>
</body>
</html>
