<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hustleville</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game">

  <header class="hud">
    <button class="gear" id="btnSettings" aria-label="Settings">⚙️</button>
    <img class="wordmark" src="assets/wordmark.svg" alt="Hustleville">
    <div class="pills">
      <div class="pill"><i class="coin-ic">$</i><b id="cash">$0</b></div>
      <div class="pill lv">👑 <b id="hudLvl">1</b></div>
      <button class="gear" id="btnGear" aria-label="Status">🏆</button>
    </div>
  </header>

  <section class="profile">
    <div class="avatar" id="avatar">👶</div>
    <div class="who"><strong id="pname"></strong><span id="psub"></span></div>
    <div class="nw" id="nw"></div>
  </section>

  <div class="stage">
    <div class="home">
      <button class="hero" id="hero" aria-label="Tap the coin to earn">
        <span class="hero-art"></span>
        <span class="fcoin">$</span>
      </button>
      <div class="lower">
        <section class="feed" id="feed" aria-live="polite"></section>
        <aside class="meters" id="meters" aria-label="Life meters"></aside>
      </div>
    </div>
    <section class="sheet" id="sheet">
      <div class="sheet-head"><b id="sheetTitle"></b><button class="xbtn" id="sheetClose" aria-label="Close">✕</button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <nav class="tabs">
    <button data-p="money"><span>💰</span>Money</button>
    <button data-p="social"><span>📱</span>Social</button>
    <button data-p="love"><span>❤️</span>Love</button>
    <button class="age" id="ageBtn" aria-label="Age one year"><b>AGE</b><small>+1 year</small></button>
    <button data-p="shop"><span>🛍️</span>Shop</button>
    <button data-p="crazy"><span>🎯</span>Activities</button>
    <button data-p="pack"><span>🎒</span>Backpack</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>

<!-- generic modal / events -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="m-icon" id="modalIcon"></div>
    <p id="modalText"></p>
    <div class="m-btns" id="modalBtns"></div>
  </div>
</div>

<!-- immersive contract desk -->
<div class="overlay contract" id="contract"><div class="desk" id="cDesk"></div></div>

<!-- title screen -->
<div class="overlay open title" id="title">
  <img src="assets/logo.svg" alt="Hustleville — Business · Life · Click">
  <p>👶 Be born · 🧑 Grow up · 💰 Build empires · ❤️ Love · 😈 Cause trouble · 👑 Rule · ⚰️ Die</p>
  <button class="btn gold big" id="btnNew">👶 Be born</button>
  <button class="btn big" id="btnCont" hidden>▶ Continue life</button>
</div>

<script src="data.js"></script>
<script src="hubs.js"></script>
<script src="social.js"></script>
<script src="garage.js"></script>
<script src="casino.js"></script>
<script src="breathe.js"></script>
<script src="gym.js"></script>
<script src="heist.js"></script>
<script src="wardrobe.js"></script>
<script src="scam.js"></script>
<script src="game.js"></script>
</body>
</html>
